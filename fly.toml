# =============================================================================
# fly.toml — Fly.io configuration for frappe-web
#
# Deploy with:
#   fly launch --no-deploy   # first time — creates app
#   fly secrets set ADMIN_PASSWORD=... DB_PASSWORD=... ENCRYPTION_KEY=...
#   fly deploy
#
# For the full stack (worker + scheduler) use separate fly.toml files
# or Fly Machines API. See UPGRADE_README.md for the full guide.
# =============================================================================

app = "crm-frappe"          # change to your Fly app name
primary_region = "iad"      # change to your preferred region

[build]
  dockerfile = "Dockerfile.frappe"

[env]
  FRAPPE_SITE_NAME = "crm-frappe.fly.dev"   # update after fly launch
  REDIS_CACHE_URL  = "redis://localhost:13000"
  REDIS_QUEUE_URL  = "redis://localhost:11000"

# Frappe web process
[[services]]
  internal_port = 8000
  protocol      = "tcp"

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval      = "30s"
    timeout       = "10s"
    grace_period  = "60s"
    method        = "GET"
    path          = "/api/method/ping"

# Persistent disk for Frappe sites/ directory
[mounts]
  source      = "frappe_sites"
  destination = "/home/frappe/frappe-bench/sites"
  initial_size = "10gb"

[resources]
  # 1 shared CPU, 1 GB RAM — minimum for Frappe
  # Upgrade to performance-1x (dedicated) for production
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 1024

# ---------------------------------------------------------------------------
# Sidecar: Redis (single-node, in-process for small deployments)
# For production use Upstash Redis and set REDIS_CACHE_URL / REDIS_QUEUE_URL
# ---------------------------------------------------------------------------
# Uncomment to run Redis as a sidecar process (not recommended for production)
# [[processes]]
#   name    = "redis-cache"
#   command = "redis-server --port 13000 --daemonize no"
#
# [[processes]]
#   name    = "redis-queue"
#   command = "redis-server --port 11000 --daemonize no"
