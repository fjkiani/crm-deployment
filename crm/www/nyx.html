{% extends "templates/web.html" %}

{% block page_content %}
<div class="container py-5" style="height: 100vh;">
    <div class="row h-100 justify-content-center align-items-center">
        <div class="col-md-8 text-center">
            <div class="mb-4">
                <h1 class="font-weight-bold">Nyx Command Center</h1>
                <p class="text-muted">The Intelligence Layer is active.</p>
            </div>

            <div class="card shadow-lg p-5 border-0">
                <div class="mb-4 text-primary">
                    <!-- Icon placeholder -->
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </div>
                <h3>Use the Floating Interface</h3>
                <p>The neural interface is available globally via the button below.</p>
                <button class="btn btn-primary btn-lg mt-3" onclick="document.getElementById('nyx-fab').click()">
                    Open Cockpit
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Inject Cockpit Logic (Redundant if globally injected, but ensures it works in Iframe) -->
<script src="/assets/crm/js/cockpit.js"></script>
{% endblock %}
