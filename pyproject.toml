[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crm"
version = "1.0.8"
description = "Kick-ass Open Source CRM"
authors = [
    {name = "Frappe Technologies Pvt. Ltd.", email = "shariq@frappe.io"}
]
dependencies = [
    "twilio==8.5.0",
    "frappe-mcp>=0.1.0",
    "requests>=2.28.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/frappe/crm"
Repository = "https://github.com/frappe/crm"

[tool.setuptools]
packages = ["crm"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
crm = ["**/*.json", "**/*.js", "**/*.html", "**/*.css", "**/*.md", "**/*.txt", "**/*.po", "**/*.pot"]

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "../crm/public/frontend"
index_html_path = "../crm/www/crm.html"
