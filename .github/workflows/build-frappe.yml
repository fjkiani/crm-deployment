name: Build and Push Frappe Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.frappe'
      - 'frappe_starter.py'
      - 'crm/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'MANIFEST.in'
      - '.github/workflows/build-frappe.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/crm-frappe

jobs:
  # ── Step 1: Bake the Frappe DB in CI (7GB RAM, no OOM) ───────────────────
  bake-db:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: crm_db
          MYSQL_USER: crm_db
          MYSQL_PASSWORD: crmpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpass --silent 2>/dev/null; then
              echo "MariaDB ready after ${i} attempts"
              break
            fi
            echo "Waiting for MariaDB... ($i/30)"
            sleep 3
          done

      - name: Grant privileges to crm_db user
        run: |
          mysql -h 127.0.0.1 -u root -prootpass -e "
            GRANT ALL PRIVILEGES ON \`crm_db\`.* TO 'crm_db'@'%' IDENTIFIED BY 'crmpass';
            GRANT ALL PRIVILEGES ON \`crm_db\`.* TO 'crm_db'@'localhost' IDENTIFIED BY 'crmpass';
            FLUSH PRIVILEGES;
          "

      - name: Start Redis on CI runner host
        run: |
          # Install and start Redis on the CI runner host
          # The Docker container will connect to it via --network host
          sudo apt-get install -y redis-server
          # Start Redis on port 6380 (avoid conflict with any default Redis)
          redis-server --port 6380 --bind 0.0.0.0 --save "" --daemonize yes --loglevel warning
          sleep 2
          redis-cli -p 6380 ping
          echo "Redis ready on port 6380"

      - name: Run bench new-site in Docker (as frappe user)
        run: |
          # frappe/erpnext:v16 runs as 'frappe' user by default.
          # bench refuses to run as root (exits with code 1).
          # We use --network host so the container can reach:
          #   - MariaDB at 127.0.0.1:3306
          #   - Redis at 127.0.0.1:6380
          docker run --rm \
            --network host \
            frappe/erpnext:v16 \
            bash -c "
              set -e
              cd /home/frappe/frappe-bench

              echo '=== Fixing apps.txt ==='
              printf 'frappe\nerpnext\ncrm\n' > sites/apps.txt

              echo '=== Writing common_site_config.json ==='
              python3 -c \"
          import json
          cfg = {
              'redis_cache': 'redis://127.0.0.1:6380',
              'redis_queue': 'redis://127.0.0.1:6380',
              'redis_socketio': 'redis://127.0.0.1:6380'
          }
          with open('sites/common_site_config.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          print('common_site_config.json written')
          \"

              echo '=== Running bench new-site ==='
              bench new-site ci.localhost \
                --db-name crm_db \
                --db-password crmpass \
                --admin-password 'Admin@CRM2026!' \
                --db-host 127.0.0.1 \
                --db-port 3306 \
                --mariadb-user-host-login-scope '%' \
                --db-root-password rootpass \
                --verbose \
                --force

              echo '=== bench new-site complete ==='
              echo 'DocType count:'
              mysql -h127.0.0.1 -P3306 -uroot -prootpass -N -s \
                -e 'SELECT COUNT(*) FROM crm_db.tabDocType;'
            "

      - name: Dump the baked DB to SQL
        run: |
          echo "Dumping crm_db..."
          mysqldump \
            -h 127.0.0.1 -u root -prootpass \
            --single-transaction \
            --routines \
            --triggers \
            --add-drop-table \
            crm_db > /tmp/frappe_baked.sql
          echo "Lines: $(wc -l < /tmp/frappe_baked.sql)"
          echo "Size: $(du -sh /tmp/frappe_baked.sql | cut -f1)"

      - name: Compress the dump
        run: |
          gzip -9 /tmp/frappe_baked.sql
          echo "Compressed size: $(du -sh /tmp/frappe_baked.sql.gz | cut -f1)"

      - name: Upload baked DB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frappe-baked-db
          path: /tmp/frappe_baked.sql.gz
          retention-days: 7

  # ── Step 2: Build Docker image with baked DB ──────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: bake-db
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download baked DB artifact
        uses: actions/download-artifact@v4
        with:
          name: frappe-baked-db
          path: ./baked-db/

      - name: Verify baked DB
        run: |
          ls -lh ./baked-db/
          echo "Baked DB ready for Docker build"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frappe
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
