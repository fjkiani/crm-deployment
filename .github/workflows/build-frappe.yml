name: Bake Frappe DB and Commit

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.frappe'
      - 'frappe_starter.py'
      - 'crm/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'MANIFEST.in'
      - '.github/workflows/build-frappe.yml'
  workflow_dispatch:

jobs:
  # ── Bake the Frappe DB in CI (7GB RAM, no OOM) and commit to repo ─────────
  bake-db:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # needed to push the baked DB back to the repo

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: crm_db
          MYSQL_USER: crm_db
          MYSQL_PASSWORD: crmpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpass --silent 2>/dev/null; then
              echo "MariaDB ready after ${i} attempts"
              break
            fi
            echo "Waiting for MariaDB... ($i/30)"
            sleep 3
          done

      - name: Grant privileges to crm_db user
        run: |
          mysql -h 127.0.0.1 -u root -prootpass -e "
            GRANT ALL PRIVILEGES ON \`crm_db\`.* TO 'crm_db'@'%' IDENTIFIED BY 'crmpass';
            GRANT ALL PRIVILEGES ON \`crm_db\`.* TO 'crm_db'@'localhost' IDENTIFIED BY 'crmpass';
            FLUSH PRIVILEGES;
          "

      - name: Start Redis on CI runner host
        run: |
          sudo apt-get install -y redis-server
          redis-server --port 6380 --bind 0.0.0.0 --save "" --daemonize yes --loglevel warning
          sleep 2
          redis-cli -p 6380 ping
          echo "Redis ready on port 6380"

      - name: Run bench new-site in Docker (as frappe user)
        run: |
          docker run --rm \
            --network host \
            frappe/erpnext:v16 \
            bash -c "
              set -e
              cd /home/frappe/frappe-bench

              echo '=== Fixing apps.txt ==='
              printf 'frappe\nerpnext\n' > sites/apps.txt

              echo '=== Writing common_site_config.json ==='
              python3 -c \"
          import json
          cfg = {
              'redis_cache': 'redis://127.0.0.1:6380',
              'redis_queue': 'redis://127.0.0.1:6380',
              'redis_socketio': 'redis://127.0.0.1:6380'
          }
          with open('sites/common_site_config.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          print('common_site_config.json written')
          \"

              echo '=== Running bench new-site ==='
              bench new-site ci.localhost \
                --db-name crm_db \
                --db-password crmpass \
                --admin-password 'Admin@CRM2026!' \
                --db-host 127.0.0.1 \
                --db-port 3306 \
                --mariadb-user-host-login-scope '%' \
                --db-root-password rootpass \
                --verbose \
                --force

              echo '=== bench new-site complete ==='
              echo 'DocType count:'
              mysql -h127.0.0.1 -P3306 -uroot -prootpass -N -s \
                -e 'SELECT COUNT(*) FROM crm_db.tabDocType;'
            "

      - name: Dump and compress the baked DB
        run: |
          echo "Dumping crm_db..."
          mysqldump \
            -h 127.0.0.1 -u root -prootpass \
            --single-transaction \
            --routines \
            --triggers \
            --add-drop-table \
            crm_db > /tmp/frappe_baked.sql
          echo "Lines: $(wc -l < /tmp/frappe_baked.sql)"
          echo "Size: $(du -sh /tmp/frappe_baked.sql | cut -f1)"
          gzip -9 /tmp/frappe_baked.sql
          echo "Compressed size: $(du -sh /tmp/frappe_baked.sql.gz | cut -f1)"
          echo "DocType count in dump:"
          zcat /tmp/frappe_baked.sql.gz | grep -c "INSERT INTO \`tabDocType\`" || true

      - name: Copy baked DB into repo
        run: |
          cp /tmp/frappe_baked.sql.gz ./baked-db/frappe_baked.sql.gz
          ls -lh ./baked-db/

      - name: Commit and push baked DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baked-db/frappe_baked.sql.gz
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to baked DB — skipping commit"
          else
            git commit -m "chore: update baked Frappe DB [skip ci]"
            git push
            echo "Baked DB committed and pushed"
          fi
